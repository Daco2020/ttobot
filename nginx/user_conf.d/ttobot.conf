# 또봇 reverse proxy.
# jonasal/nginx-certbot 이미지가 이 디렉터리(/etc/nginx/user_conf.d)의 server 블록을 자동으로 로드하고,
# 첫 기동 시 server_name 에 대한 Let's Encrypt 인증서를 발급한다.
# HTTP(80) → HTTPS(443) 리다이렉트는 이미지 내장 default_conf 가 자동으로 처리하므로 여기서 정의 X.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ttobot.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/ttobot.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttobot.kro.kr/privkey.pem;

    # 큰 요청 본문 허용 (예: 종이비행기 메시지 길이는 작지만 여유분).
    client_max_body_size 10m;

    location / {
        # docker network 안의 서비스명으로 접근. compose 파일의 서비스 이름과 일치.
        proxy_pass http://ttobot:3389;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 슬랙 봇 응답이 길어질 수 있어 타임아웃 여유 있게.
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
