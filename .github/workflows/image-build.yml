name: build-and-push

# main 에 푸시되면 Docker 이미지를 빌드해 GHCR 에 올린다.
# 인스턴스의 watchtower 가 이 :latest 태그 변화를 감지해 자동 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 트리거(재빌드)용

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR 푸시 권한 (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 이미지 경로는 반드시 소문자여야 한다. repository_owner(Daco2020)를
      # 그대로 쓰면 대문자 때문에 push 가 실패하므로 소문자로 변환한다.
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ttobot" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
